name: 자동 초안

# 미니PC 의 작업 스케줄러를 대신한다. 로직은 .github/scripts/daily-draft.sh 에 있고,
# 그건 scripts/runner.ps1 을 그대로 옮긴 것이다.
#
# 미니PC 의 작업(댕냥피디아-주간초안, 매일 09:00)은 2026-08-10 에 비활성화했다.
# 되돌리려면 미니PC 에서 Enable-ScheduledTask 하고 아래 schedule 을 다시 주석 처리한다
# — 둘 다 켜져 있으면 하루에 글이 두 편 발행된다.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '플러밍만 확인 (초안 생성·PR·머지 건너뜀)'
        type: boolean
        default: false
  schedule:
    - cron: '0 0 * * *'   # 00:00 UTC = 09:00 KST

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: daily-draft        # 겹쳐 돌면 브랜치가 충돌한다
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # publish-reviewer 가 git diff origin/main...HEAD 를 본다

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Claude Code 설치
        run: npm install -g @anthropic-ai/claude-code

      - name: 자동 초안 생성·검토·발행
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: bash .github/scripts/daily-draft.sh
