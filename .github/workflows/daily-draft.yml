name: 자동 초안

# 미니PC 의 작업 스케줄러를 대신한다. 로직은 .github/scripts/daily-draft.sh 에 있고,
# 그건 scripts/runner.ps1 을 그대로 옮긴 것이다.
#
# 미니PC 의 작업(댕냥피디아-주간초안, 매일 09:00)은 2026-08-10 에 비활성화했다.
# 되돌리려면 미니PC 에서 Enable-ScheduledTask 하고 아래 schedule 을 다시 주석 처리한다
# — 둘 다 켜져 있으면 하루에 글이 두 편 발행된다.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: '플러밍만 확인 (초안 생성·PR·머지 건너뜀)'
        type: boolean
        default: false
  # 2026-08-30 자동 발행 중단.
  #
  # 애드센스 2차 거절(사유: 가치가 별로 없는 콘텐츠) 후 진단한 결과, 초안을 쓰는
  # content-writer 가 WebSearch/WebFetch 를 못 가진 채로 88편을 썼다. 발행 게이트
  # 5개도 전부 자기 사이트 내부만 검사한다 — "웹에 이미 있는 답 대비 이 글이 무엇을
  # 더하는가"를 묻는 검사가 없었다. 그 결과 구글은 7/25 이후 새 글을 크롤링조차
  # 하지 않는다(GSC "발견됨-현재 색인 생성되지 않음" 22건, 최종 크롤링 "해당사항 없음").
  #
  # 이 상태로 계속 돌리면 크롤링되지 않는 페이지만 하루 한 장씩 쌓인다.
  # 재개 조건은 .claude/RESTART-CHECKLIST.md 에 있다. 재개해도 매일이 아니라 주 2편이다.
  # schedule:
  #   - cron: '0 0 * * *'   # 00:00 UTC = 09:00 KST

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: daily-draft        # 겹쳐 돌면 브랜치가 충돌한다
  cancel-in-progress: false

jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # publish-reviewer 가 git diff origin/main...HEAD 를 본다

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Claude Code 설치
        run: bash .github/scripts/install-claude.sh

      - name: 자동 초안 생성·검토·발행
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: bash .github/scripts/daily-draft.sh
