name: 자동 초안 감시

# 미니PC의 09:00 자동 초안이 제대로 발행됐는지 GitHub 쪽에서 확인한다.
# 로직은 .github/scripts/draft-watchdog.sh 에 있다 (YAML 블록 스칼라 안에
# 여러 줄 문자열을 넣으면 들여쓰기가 깨져 파싱이 실패하므로 파일로 분리).
on:
  schedule:
    - cron: '0 3 * * *'   # 03:00 UTC = 12:00 KST (초안 실행 3시간 뒤)
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: read
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 초안 발행 상태 점검
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash .github/scripts/draft-watchdog.sh
